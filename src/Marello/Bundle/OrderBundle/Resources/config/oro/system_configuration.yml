system_configuration:
    groups:
        marello_order:
            title: marello.order.system_configuration.groups.order.title
        marello_order_on_demand_general:
            title: marello.order.system_configuration.groups.order_on_demand.general.label
        marello_order_general:
            title: marello.order.system_configuration.groups.order_general.title
            icon: fa-shopping-cart
            priority: 10
        marello_order_on_demand:
            title: marello.order.system_configuration.groups.order_on_demand.title
            icon: fa-cog
            priority: 100
    fields:
        marello_order.order_notification:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
                label: marello.order.system_configuration.fields.order_notification.label
                required: false

        marello_order.confirmation_email_template:
            data_type: string
            type: 'Marello\Bundle\NotificationBundle\Form\Type\EmailTemplateSelectType'
            options:
                label: marello.notification.config.fields.order.confirmation_email_template.label
                required: false
                entityName: Marello\Bundle\OrderBundle\Entity\Order
                placeholder: marello.notification.config.fields.email_template.placeholder

        marello_order.cancelled_email_template:
            data_type: string
            type: 'Marello\Bundle\NotificationBundle\Form\Type\EmailTemplateSelectType'
            options:
                label: marello.notification.config.fields.order.cancelled_email_template.label
                required: false
                entityName: Marello\Bundle\OrderBundle\Entity\Order
                placeholder: marello.notification.config.fields.email_template.placeholder

        marello_order.payment_reminder_email_template:
            data_type: string
            type: 'Marello\Bundle\NotificationBundle\Form\Type\EmailTemplateSelectType'
            options:
                label: marello.notification.config.fields.order.payment_reminder_email_template.label
                required: false
                entityName: Marello\Bundle\OrderBundle\Entity\Order
                placeholder: marello.notification.config.fields.email_template.placeholder

        marello_order.shipped_confirmation_email_template:
            data_type: string
            type: 'Marello\Bundle\NotificationBundle\Form\Type\EmailTemplateSelectType'
            options:
                label: marello.notification.config.fields.order.shipped_confirmation_email_template.label
                required: false
                entityName: Marello\Bundle\OrderBundle\Entity\Order
                placeholder: marello.notification.config.fields.email_template.placeholder

        marello_order.shipping_prepared_email_template:
            data_type: string
            type: 'Marello\Bundle\NotificationBundle\Form\Type\EmailTemplateSelectType'
            options:
                label: marello.notification.config.fields.order.shipping_prepared_email_template.label
                required: false
                entityName: Marello\Bundle\OrderBundle\Entity\Order
                placeholder: marello.notification.config.fields.email_template.placeholder

        marello_order.shipping_prepared_warehouse_email_template:
            data_type: string
            type: 'Marello\Bundle\NotificationBundle\Form\Type\EmailTemplateSelectType'
            options:
                label: marello.notification.config.fields.order.shipping_prepared_warehouse_email_template.label
                required: false
                entityName: Marello\Bundle\OrderBundle\Entity\Order
                placeholder: marello.notification.config.fields.email_template.placeholder

        marello_order.order_on_demand_enabled:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
                label: marello.order.system_configuration.fields.order_on_demand_enabled.label
                required: false

        marello_order.order_on_demand:
            data_type: boolean
            type: Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            options:
                label: marello.order.system_configuration.fields.order_on_demand.label
                tooltip: marello.order.system_configuration.fields.tooltip.order_on_demand
                required: false

    tree:
        system_configuration:
            marello:
                children:
                    notification:
                        children:
                            notification_configuration:
                                children:
                                    notification_general:
                                        children:
                                            - marello_order.confirmation_email_template
                                            - marello_order.cancelled_email_template
                                            - marello_order.payment_reminder_email_template
                                            - marello_order.shipped_confirmation_email_template
                                            - marello_order.shipping_prepared_email_template
                                            - marello_order.shipping_prepared_warehouse_email_template
                    marello_order:
                        children:
                            marello_order_on_demand:
                                children:
                                    marello_order_on_demand_general:
                                        children:
                                            - marello_order.order_on_demand_enabled
                                            - marello_order.order_on_demand
        organization_configuration:
            marello:
                children:
                    notification:
                        children:
                            notification_configuration:
                                children:
                                    notification_general:
                                        children:
                                            - marello_order.confirmation_email_template
                                            - marello_order.cancelled_email_template
                                            - marello_order.payment_reminder_email_template
                                            - marello_order.shipped_confirmation_email_template
                                            - marello_order.shipping_prepared_email_template
                                            - marello_order.shipping_prepared_warehouse_email_template
                    marello_order:
                        children:
                            marello_order_on_demand:
                                children:
                                    marello_order_on_demand_general:
                                        children:
                                            - marello_order.order_on_demand_enabled
                                            - marello_order.order_on_demand
