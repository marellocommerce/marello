system_configuration:
    fields:
        marello_packing.send_packing_slip_template:
            data_type: string
            type: 'Marello\Bundle\NotificationBundle\Form\Type\EmailTemplateSelectType'
            options:
                label: marello.notification.config.fields.packing.send_packing_slip.label
                required: false
                entityName: Marello\Bundle\PackingBundle\Entity\PackingSlip
                placeholder: marello.notification.config.fields.email_template.placeholder

    tree:
        system_configuration:
            marello:
                children:
                    notification:
                        children:
                            notification_configuration:
                                children:
                                    notification_general:
                                        children:
                                            - marello_packing.send_packing_slip_template
        organization_configuration:
            marello:
                children:
                    notification:
                        children:
                            notification_configuration:
                                children:
                                    notification_general:
                                        children:
                                            - marello_packing.send_packing_slip_template