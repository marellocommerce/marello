api:
    entity_aliases:
        Marello\Bundle\CatalogBundle\Entity\Category:
            alias: marellocategory
            plural_alias: marellocategories

    entities:
        Marello\Bundle\CatalogBundle\Entity\Category:
            fields:
                createdAt:
                    exclude: true
                updatedAt:
                    exclude: true
            filters:
                exclusion_policy: all
                fields:
                    type:
                        data_type: string
                        property_path: type
                        description: 'Filter by Type'
                    customer:
                        data_type: string
                        property_path: customer.email
                        description: 'Filter by Customer email'
                    companies:
                        data_type: string
                        allow_array: true
                        property_path: companies.id
                        description: 'Filter by Company Id'
            actions:
                delete_relationship: false
