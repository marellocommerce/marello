marello:
    notification:
        id.label:               Id
        entity_label:           Email Notification
        entity_plural_label:    Email Notifications
        entity_grid_all_view_label: All %entity_plural_label%
        body.label:             Body
        recipients.label:       Recipients
        organization.label:     Organization
        template.label:         Template
        attachments.label:      Attachments

        system_configuration:
            groups:
                notification.title: Notification
                notification_configuration.title: Notification Configuration
                notification_general.label: General


        config:
            fields:
                email_template:
                    placeholder:    Don't Send Email

                order:
