                invoice:
                    invoice_email_template.label: Invoice Email Template

                allocation:
                    warehouse_allocation_template.label: Warehouse Allocation Template
                    shipped_allocation_confirmation.label: Shipped Allocation Template

                return:
                    return_created_template.label:  Return Created Template
                    return_not_verified.label:  Return Not Verified Template
                    return_received.label:  Return Received Template
                    inspection_not_ok_template.label:  Return Inspection Not OK Template
                    reminder_template.label:  Return Reminder Template

                refund:
                    refund_credited_template.label: Refund Credited Template

                packing:
                    send_packing_slip.label:  PackingSlip Template

                purchaseorder:
                    purchaseorder_notification_template.label: PurchaseOrder Template