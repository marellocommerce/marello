operations:
    marello_payment_add_to_invoice:
        label: marello.payment.button.add_payment.label
        applications: [default]
        acl_resource: [EDIT, $.data]
        order: 20
        routes:
            - marello_invoice_invoice_view
            - marello_order_order_view
        attributes:
            invoice_paid_amount:
                label: marello.payment.total_paid.label
                type: float
            payment_method:
                label: marello.payment.payment_method.label
                type: string
            payment_date:
                label: marello.payment.payment_date.label
                type: object
                options:
                    class: \DateTime
            payment_reference:
                label: marello.payment.payment_reference.label
                type: string
            payment_details:
                label: marello.payment.payment_details.label
                type: string
            total_paid:
                label: marello.payment.total_paid.label
                type: object
                options:
                    class: Oro\Bundle\CurrencyBundle\Entity\Price
            action_result:
                label: 'result'
                type: array
            invoice_available:
                label: 'is available'
                type: boolean
        form_options:
            attribute_fields:
                payment_method:
                    form_type: Marello\Bundle\PaymentBundle\Form\Type\PaymentMethodSelectType
                    options:
                        required: true
                        constraints:
                            - NotBlank: ~
                payment_date:
                    form_type: Oro\Bundle\FormBundle\Form\Type\OroDateTimeType
                    options:
                        required: true
                        constraints:
                            - NotBlank: ~
                payment_reference:
                    form_type: Symfony\Component\Form\Extension\Core\Type\TextType
                    options:
                        required: true
                        constraints:
                            - NotBlank: ~
                payment_details:
                    form_type: Symfony\Component\Form\Extension\Core\Type\TextType
                    options:
                        required: true
                        constraints:
                            - NotBlank: ~
                total_paid:
                    form_type: Marello\Bundle\OrderBundle\Form\Type\OrderTotalPaidType
                    options:
                        required: true
                        currency: $.data.currency
        frontend_options:
            options:
                width: 2000
            show_dialog: true
            template: '@MarelloPayment/Action/payment_popup.html.twig'
        preactions:
            - '@call_service_method':
                  service: marello_invoice.provider.invoice_paid_amount
                  method: getPaidAmountForEntity
                  method_parameters: [$.data]
                  attribute: $.invoice_paid_amount
            - '@call_service_method':
                  service: marello_invoice.provider.invoice_paid_amount
                  method: isInvoiceAvailable
                  method_parameters: [$.data]
                  attribute: $.invoice_available
        preconditions:
            '@and':
                - '@less': [$.invoice_paid_amount, $.data.grandTotal]
                - '@equal': [$.invoice_available, true]
        actions:
            - '@call_service_method':
                  service: marello_payment.action.handler.add_payment
                  method: addPaymentToEntity
                  method_parameters: [$.data, $.payment_method, $.payment_date, $.payment_reference, $.payment_details, $.total_paid.value]
                  attribute: $.action_result
            - '@flash_message':
                  message: $.action_result.message
                  message_parameters:
                      entity_type: $.action_result.message_parameters.entity_type
                  type: $.action_result.type

    send_invoice_email:
        label: marello.invoice.action.send_invoice_email.label
        applications: [default]
        acl_resource: [EDIT, $.data]
        order: 10
        button_options:
            icon: fa-envelope
        routes:
            - marello_invoice_invoice_view
        attributes:
            send_customer_email:
                label: 'marello.invoice.action.send_invoice_email.customer_email'
                type: boolean
            send_company_email:
                label: 'marello.invoice.action.send_invoice_email.company_email'
                type: boolean
        form_options:
            attribute_fields:
                send_customer_email:
                    form_type: Marello\Bundle\InvoiceBundle\Form\Type\CompanyEmailCheckboxType
                    options:
                        relatedEntity: $.data.customer
                send_company_email:
                    form_type: Marello\Bundle\InvoiceBundle\Form\Type\CompanyEmailCheckboxType
                    options:
                        relatedEntity: $.data.customer.company
        frontend_options:
            show_dialog: true
            title: marello.invoice.action.send_invoice_email.title
            template: '@MarelloInvoice/Action/send_invoice_email_popup.html.twig'
        actions:
            - '@call_service_method':
                  service: oro_config.manager
                  method: get
                  method_parameters:
                      - 'marello_pdf.email_sender_email'
                      - false
                      - false
                      - '$.data.order.salesChannel'
                  attribute: '$.sender_email'
            - '@tree':
                  conditions:
                      '@not_empty': [ '$.sender_email' ]
                  actions:
                      - '@call_service_method':
                            service: oro_config.manager
                            method: get
                            method_parameters:
                                - 'marello_pdf.email_sender_name'
                                - false
                                - false
                                - '$.data.order.salesChannel'
                            attribute: '$.sender_name'
                      - '@call_service_method':
                            service: oro_config.manager
                            method: get
                            method_parameters:
                                - 'marello_pdf.email_bcc'
                                - false
                                - false
                                - '$.data.order.salesChannel'
                            attribute: '$.bcc'
                      - '@call_service_method':
                            service: translator
                            method: trans
                            method_parameters:
                                - 'marello.invoice.pdf.filename.label'
                                - { '%%invoiceType%%': '$.data.invoiceType', '%%entityNumber%%': '$.data.invoiceNumber' }
                            attribute: '$.filename'
                      - '@call_service_method':
                            service: marello_pdf.provider.render_parameters
                            method: getParams
                            method_parameters:
                                - '$.data'
                                - { config_scope: '$.data.order.salesChannel' }
                            attribute: '$.render_parameters'
                      - '@call_service_method':
                            service: marello_pdf.renderer.twig
                            method: renderBase64
                            method_parameters:
                                - '@MarelloInvoice/Pdf/invoice.html.twig'
                                - '$.render_parameters'
                            attribute: '$.invoice_pdf'
                      -   '@tree':
                              conditions:
                                  '@and':
                                      - '@equal': [$.send_customer_email, true]
                              actions:
                                  -   '@assign_value': [ '$.receiver_email', '$.data.customer.email' ]
                                  -   '@assign_value': [ '$.receiver_name', '$.data.customer.fullName' ]
                                  -   '@send_email_template_attachment':
                                          parameters:
                                              from: { email: '$.sender_email', name: '$.sender_name' }
                                              to: { email: '$.receiver_email', name: '$.receiver_name' }
                                              template: marello_send_invoice
                                              bcc: '$.bcc'
                                              entity: '$.data'
                                              context: '$.data.order'
                                              attachments:
                                                  -   filename: '$.filename'
                                                      body: '$.invoice_pdf'
                                                      mimetype: 'application/pdf'
                      -   '@tree':
                              conditions:
                                  '@and':
                                      - '@not_empty': [ '$.data.customer.company' ]
                                      - '@not_empty': [ '$.data.customer.company.invoiceEmail' ]
                                      - '@equal': [$.send_company_email, true]
                              actions:
                                  -   '@assign_value': [ '$.receiver_email', '$.data.customer.company.invoiceEmail' ]
                                  -   '@assign_value': [ '$.receiver_name', '$.data.customer.company.name' ]
                                  -   '@send_email_template_attachment':
                                          parameters:
                                              from: { email: '$.sender_email', name: '$.sender_name' }
                                              to: { email: '$.receiver_email', name: '$.receiver_name' }
                                              template: marello_send_invoice
                                              bcc: '$.bcc'
                                              entity: '$.data'
                                              context: '$.data.order'
                                              attachments:
                                                  -   filename: '$.filename'
                                                      body: '$.invoice_pdf'
                                                      mimetype: 'application/pdf'
                      -   '@tree':
                              conditions:
                                  '@or':
                                      - '@equal': [$.send_customer_email, true]
                                      - '@equal': [$.send_company_email, true]
                              actions:
                                  - '@flash_message':
                                        type: 'success'
                                        message: marello.invoice.action.send_invoice_email.success
                      -   '@tree':
                              conditions:
                                  '@and':
                                      - '@equal': [$.send_customer_email, false]
                                      - '@equal': [$.send_company_email, false]
                              actions:
                                  - '@flash_message':
                                        type: 'warning'
                                        message: marello.invoice.action.send_invoice_email.warning
            - '@tree':
                  conditions:
                      '@empty': [ '$.sender_email' ]
                  actions:
                      - '@flash_message':
                            type: 'error'
                            message: marello.invoice.action.send_invoice_email.error